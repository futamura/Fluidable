name: Coverage

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-coverage:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -showsdks

      - name: Resolve packages
        run: .github/scripts/retry.sh 3 swift package resolve

      - name: SwiftPM iOS simulator build
        run: |
          SDK_PATH="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          swift build --sdk "$SDK_PATH" --triple arm64-apple-ios15.0-simulator

      - name: Resolve iOS simulator destination
        run: |
          IOS_DESTINATION="$(ruby fastlane/ios_simulator_destination.rb)"
          echo "IOS_DESTINATION=$IOS_DESTINATION" >> "$GITHUB_ENV"
          echo "Using iOS simulator destination: $IOS_DESTINATION"

      - name: Resolve Xcode project packages
        run: .github/scripts/retry.sh 3 xcodebuild -resolvePackageDependencies -project Fluidable.xcodeproj -scheme Fluidable

      - name: Xcode build-for-testing on iOS Simulator
        run: xcodebuild build-for-testing -project Fluidable.xcodeproj -scheme Fluidable -destination "$IOS_DESTINATION" CODE_SIGNING_ALLOWED=NO

      - name: Prepare coverage directory
        run: mkdir -p Reports/coverage/unit

      - name: Boot iOS simulator
        timeout-minutes: 10
        run: |
          SIMULATOR_UDID="${IOS_DESTINATION##*id=}"
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Xcode unit coverage on iOS Simulator
        run: |
          RESULT_BUNDLE="Reports/coverage/unit/Fluidable.xcresult"
          .github/scripts/retry-if-no-tests-ran.sh "$RESULT_BUNDLE" \
            xcodebuild test -project Fluidable.xcodeproj -scheme Fluidable -destination "$IOS_DESTINATION" -only-testing:FluidableTests -enableCodeCoverage YES -resultBundlePath "$RESULT_BUNDLE" CODE_SIGNING_ALLOWED=NO

      - name: Export unit coverage report
        run: xcrun xccov view --report Reports/coverage/unit/Fluidable.xcresult > Reports/coverage/unit/xccov.txt

      - name: Upload unit coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          flags: unit
          name: Fluidable unit coverage
          swift_project: Fluidable
          token: ${{ secrets.CODECOV_TOKEN }}

  ui-coverage:
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      FLUIDABLE_UI_TEST_SHARD_INDEX: ${{ matrix.shard }}
      FLUIDABLE_UI_TEST_SHARD_TOTAL: 4
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -showsdks

      - name: Resolve packages
        run: .github/scripts/retry.sh 3 swift package resolve

      - name: SwiftPM iOS simulator build
        run: |
          SDK_PATH="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          swift build --sdk "$SDK_PATH" --triple arm64-apple-ios15.0-simulator

      - name: Resolve iOS simulator destination
        run: |
          IOS_DESTINATION="$(ruby fastlane/ios_simulator_destination.rb)"
          echo "IOS_DESTINATION=$IOS_DESTINATION" >> "$GITHUB_ENV"
          echo "Using iOS simulator destination: $IOS_DESTINATION"

      - name: Prepare coverage directory
        run: |
          mkdir -p Reports/coverage/ui-shard-${{ matrix.shard }}
          echo "UI_DERIVED_DATA_PATH=$HOME/Library/Developer/Xcode/DerivedData/FluidableCoverage-ui-shard-${{ matrix.shard }}" >> "$GITHUB_ENV"

      - name: Resolve Xcode project packages
        run: .github/scripts/retry.sh 3 xcodebuild -resolvePackageDependencies -project Fluidable.xcodeproj -scheme Fluidable -derivedDataPath "$UI_DERIVED_DATA_PATH"

      - name: Xcode build-for-testing for UI coverage
        run: xcodebuild build-for-testing -project Fluidable.xcodeproj -scheme Fluidable -destination "$IOS_DESTINATION" -derivedDataPath "$UI_DERIVED_DATA_PATH" -enableCodeCoverage YES CODE_SIGNING_ALLOWED=NO

      - name: Configure UI coverage shard
        run: |
          XCTESTRUN_FILE="$(find "$UI_DERIVED_DATA_PATH/Build/Products" -path '*/Build/Products/*.xctestrun' -print -quit)"
          if [ -z "$XCTESTRUN_FILE" ]; then
            echo "Missing .xctestrun file"
            exit 1
          fi
          echo "XCTESTRUN_FILE=$XCTESTRUN_FILE" >> "$GITHUB_ENV"
          plutil -replace FluidableUITests.EnvironmentVariables.FLUIDABLE_UI_TEST_SHARD_INDEX -string "${FLUIDABLE_UI_TEST_SHARD_INDEX}" "$XCTESTRUN_FILE"
          plutil -replace FluidableUITests.EnvironmentVariables.FLUIDABLE_UI_TEST_SHARD_TOTAL -string "${FLUIDABLE_UI_TEST_SHARD_TOTAL}" "$XCTESTRUN_FILE"
          plutil -replace FluidableUITests.TestingEnvironmentVariables.FLUIDABLE_UI_TEST_SHARD_INDEX -string "${FLUIDABLE_UI_TEST_SHARD_INDEX}" "$XCTESTRUN_FILE"
          plutil -replace FluidableUITests.TestingEnvironmentVariables.FLUIDABLE_UI_TEST_SHARD_TOTAL -string "${FLUIDABLE_UI_TEST_SHARD_TOTAL}" "$XCTESTRUN_FILE"

      - name: Boot iOS simulator
        timeout-minutes: 10
        run: |
          SIMULATOR_UDID="${IOS_DESTINATION##*id=}"
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Show simulator pairs before UI tests
        run: xcrun simctl list pairs

      - name: Xcode UI coverage shard on iOS Simulator
        run: |
          RESULT_BUNDLE="Reports/coverage/ui-shard-${{ matrix.shard }}/Fluidable.xcresult"
          .github/scripts/retry-if-no-tests-ran.sh "$RESULT_BUNDLE" \
            xcodebuild test-without-building -xctestrun "$XCTESTRUN_FILE" -destination "$IOS_DESTINATION" -derivedDataPath "$UI_DERIVED_DATA_PATH" -only-testing:FluidableUITests -resultBundlePath "$RESULT_BUNDLE" -retry-tests-on-failure -test-iterations 2

      - name: Show simulator pairs after UI tests
        if: always()
        run: xcrun simctl list pairs

      - name: Collect UI test diagnostics
        if: failure()
        run: |
          DIAGNOSTICS_DIR="Reports/diagnostics/ui-shard-${{ matrix.shard }}"
          mkdir -p "$DIAGNOSTICS_DIR"
          cp -R Reports/coverage/ui-shard-${{ matrix.shard }}/. "$DIAGNOSTICS_DIR/" || true
          cp -R "$HOME/Library/Logs/DiagnosticReports" "$DIAGNOSTICS_DIR/DiagnosticReports" || true
          if [ -n "${SIMULATOR_UDID:-}" ]; then
            cp -R "$HOME/Library/Logs/CoreSimulator/$SIMULATOR_UDID" "$DIAGNOSTICS_DIR/CoreSimulator" || true
            xcrun simctl spawn "$SIMULATOR_UDID" log show --last 1h --style compact > "$DIAGNOSTICS_DIR/simulator.log" || true
          fi

      - name: Upload UI test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-diagnostics-shard-${{ matrix.shard }}
          path: Reports/diagnostics/ui-shard-${{ matrix.shard }}
          retention-days: 14

      - name: Export UI coverage report
        run: xcrun xccov view --report Reports/coverage/ui-shard-${{ matrix.shard }}/Fluidable.xcresult > Reports/coverage/ui-shard-${{ matrix.shard }}/xccov.txt

      - name: Upload UI coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          flags: ui
          name: Fluidable UI coverage shard ${{ matrix.shard }}
          swift_project: Fluidable
          token: ${{ secrets.CODECOV_TOKEN }}
